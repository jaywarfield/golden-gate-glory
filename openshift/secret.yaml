# openshift/secret.yaml
# Golden Gate Glory – API credentials for the Flask container.
#
# !! NEVER commit real values to Git !!
# Fill in base64-encoded values below, then apply:
#   oc apply -f openshift/secret.yaml
#
# To base64-encode a value:
#   echo -n "your-value-here" | base64
#
# To create the secret directly without a file (safer):
#   oc create secret generic golden-gate-glory-secrets \
#     --from-literal=ORCHESTRATE_ENDPOINT="https://api.jp-tok..." \
#     --from-literal=ORCHESTRATE_API_KEY="your-api-key"

apiVersion: v1
kind: Secret
metadata:
  name: golden-gate-glory-secrets
  namespace: jaywarfield-dev
type: Opaque
# stringData accepts plain text — Kubernetes base64-encodes it automatically.
# Never commit real values to Git; use `oc create secret` for real credentials.
stringData:
  #ORCHESTRATE_ENDPOINT: "REPLACE_WITH_ENDPOINT"
  ORCHESTRATE_ENDPOINT: "https://api.jp-tok.watson-orchestrate.cloud.ibm.com/instances/bcbcc76f-9676-45b8-a576-3db66355c09"
  ORCHESTRATE_API_KEY: "nagyUNCejOq9ejOuslS_7CaNDmlQWIJ340WeMvbJr6at"
