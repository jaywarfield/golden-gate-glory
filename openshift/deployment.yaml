# openshift/deployment.yaml
# Golden Gate Glory – Veteran Career Navigator
# Deploys the Phase 1 Flask web front-end on OpenShift.
#
# Apply with:
#   oc apply -f openshift/secret.yaml
#   oc apply -f openshift/deployment.yaml
#
# Prerequisites:
#   1. Image pushed to a registry the cluster can pull from, e.g.:
#      docker build -t quay.io/<your-org>/golden-gate-glory-web:latest .
#      docker push quay.io/<your-org>/golden-gate-glory-web:latest
#   2. openshift/secret.yaml applied first (holds API credentials).
#   3. Replace <your-org> and <your-namespace> below.

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: golden-gate-glory-web
  namespace: jaywarfield-dev
  labels:
    app: golden-gate-glory-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: golden-gate-glory-web
  template:
    metadata:
      labels:
        app: golden-gate-glory-web
    spec:
      # OpenShift restricted SCC: no root, no privilege escalation
      securityContext:
        runAsNonRoot: true
        # runAsUser: 1001
      containers:
        - name: web
          image: quay.io/jaywarfield/golden-gate-glory-web:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: USE_MOCK
              value: "false"                  # flip to "true" for demo mode
            - name: ORCHESTRATE_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: golden-gate-glory-secrets
                  key: ORCHESTRATE_ENDPOINT
            - name: ORCHESTRATE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: golden-gate-glory-secrets
                  key: ORCHESTRATE_API_KEY
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: golden-gate-glory-web
  namespace: jaywarfield-dev
  labels:
    app: golden-gate-glory-web
spec:
  selector:
    app: golden-gate-glory-web
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  type: ClusterIP

---
# Route exposes the Service externally via OpenShift's built-in ingress.
# TLS is edge-terminated at the router (HTTPS → HTTP inside the cluster).
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: golden-gate-glory-web
  namespace: jaywarfield-dev
  labels:
    app: golden-gate-glory-web
spec:
  to:
    kind: Service
    name: golden-gate-glory-web
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
